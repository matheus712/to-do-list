<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Agenda</title>

    <style>
        :root {
            --bg: #0f0f13;
            --panel: rgba(45, 45, 50, 0.7);
            --accent: #9ca3af;
            --metal-light: #e5e7eb;
            --text: #f3f4f6;
            --danger: #ef4444;
            --success: #10b981;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at center, #1e1e26 0%, #0f0f13 100%);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Estrelas com tamanhos variados */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
            animation: pulse var(--d) infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        /* Painel Central Glassmorphism */
        .panel {
            width: 90%;
            max-width: 500px;
            background: var(--panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 10;
        }

        h1 { margin: 0 0 10px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; font-size: 1.8rem; }
        .muted { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }

        .main-btn {
            background: var(--metal-light);
            color: #111;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }

        .main-btn:hover { transform: translateY(-2px); background: #fff; box-shadow: 0 6px 20px rgba(255,255,255,0.2); }

        /* Modais */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show { display: flex; opacity: 1; }

        .modal-card {
            background: #1f1f23;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--glass-border);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal.show .modal-card { transform: scale(1); }

        /* Inputs Estilizados */
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #3f3f46;
            background: #18181b;
            color: white;
            margin-bottom: 15px;
            outline: none;
        }

        input:focus { border-color: var(--metal-light); }

        .save-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--success);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        /* Lista de Eventos */
        .list { max-height: 350px; overflow-y: auto; margin-top: 20px; padding-right: 5px; }
        .list::-webkit-scrollbar { width: 4px; }
        .list::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }

        .list-item {
            background: #27272a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            text-align: left;
            border-left: 4px solid var(--metal-light);
        }

        .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .item-title { font-weight: 600; color: #fff; }
        .item-date { font-size: 0.75rem; color: #71717a; }
        .item-desc { font-size: 0.85rem; color: #a1a1aa; }

        .del-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            align-self: flex-end;
        }

        .del-btn:hover { background: var(--danger); color: white; }

        /* Floating Agenda Button */
        .agenda-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--panel);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 15px 20px;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .badge {
            background: var(--metal-light);
            color: #000;
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="panel">
    <h1>Agenda</h1>
    <p class="muted">Organize sua rotina com elegância.</p>
    <button class="main-btn" id="open-add">+ Novo Evento</button>
</div>

<div class="modal" id="addModal">
    <div class="modal-card">
        <h3 style="margin-top:0">Criar Evento</h3>
        <input id="evt-title" placeholder="O que você vai fazer?" autocomplete="off" />
        <textarea id="evt-desc" rows="3" placeholder="Detalhes (opcional)"></textarea>
        <div style="display:flex; gap:10px">
            <button class="save-btn" id="saveEvt">Confirmar</button>
            <button class="save-btn" style="background:#3f3f46" id="closeAdd">Cancelar</button>
        </div>
    </div>
</div>

<div class="modal" id="agendaModal">
    <div class="modal-card" style="max-width:450px">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <h3 style="margin:0">Meus Compromissos</h3>
            <button id="closeAgenda" style="background:none; border:none; color:white; cursor:pointer; font-size:1.2rem">✕</button>
        </div>
        <div class="list" id="list"></div>
        <button id="clearAll" style="background:none; border:1px solid #3f3f46; color:#71717a; margin-top:15px; width:100%; padding:8px; border-radius:8px; cursor:pointer">Limpar tudo</button>
    </div>
</div>

<button class="agenda-btn" id="btn-agenda">
    <span>📘 Agenda</span>
    <span class="badge" id="count-badge">0</span>
</button>

<script>
let events = [];
const STORAGE_KEY = 'agenda_premium_v1';

// Gerenciamento de Dados
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); updateUI(); }
function load() { 
    const data = localStorage.getItem(STORAGE_KEY);
    if(data) events = JSON.parse(data);
    updateUI();
}

function updateUI() {
    const listEl = document.getElementById('list');
    const badge = document.getElementById('count-badge');
    badge.innerText = events.length;
    
    listEl.innerHTML = '';
    
    if(events.length === 0) {
        listEl.innerHTML = '<div class="muted" style="text-align:center; padding:20px">Nenhum evento agendado.</div>';
    } else {
        events.slice().reverse().forEach(ev => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `
                <div class="item-header">
                    <span class="item-title">${escapeHtml(ev.title)}</span>
                    <span class="item-date">${new Date(ev.created).toLocaleDateString()}</span>
                </div>
                ${ev.desc ? `<div class="item-desc">${escapeHtml(ev.desc)}</div>` : ''}
                <button class="del-btn" onclick="deleteEvent('${ev.id}')">Excluir</button>
            `;
            listEl.appendChild(div);
        });
    }
}

function deleteEvent(id) {
    events = events.filter(e => e.id !== id);
    save();
}

function escapeHtml(s) {
    const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"};
    return s.replace(/[&<>"']/g, m => map[m]);
}

// Inicialização
document.addEventListener('DOMContentLoaded', () => {
    // Gerar Estrelas
    for(let i=0; i<80; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 3 + 1;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.top = Math.random() * 100 + 'vh';
        s.style.setProperty('--d', (Math.random() * 3 + 2) + 's');
        document.body.appendChild(s);
    }

    const addModal = document.getElementById('addModal');
    const agendaModal = document.getElementById('agendaModal');
    const titleInput = document.getElementById('evt-title');
    const descInput = document.getElementById('evt-desc');

    // Eventos de clique
    document.getElementById('open-add').onclick = () => { addModal.classList.add('show'); titleInput.focus(); };
    document.getElementById('closeAdd').onclick = () => addModal.classList.remove('show');
    document.getElementById('btn-agenda').onclick = () => agendaModal.classList.add('show');
    document.getElementById('closeAgenda').onclick = () => agendaModal.classList.remove('show');

    document.getElementById('saveEvt').onclick = () => {
        const t = titleInput.value.trim();
        if(!t) return alert("Dê um título ao evento!");
        
        events.push({
            id: Date.now().toString(36),
            title: t,
            desc: descInput.value.trim(),
            created: Date.now()
        });
        
        titleInput.value = '';
        descInput.value = '';
        addModal.classList.remove('show');
        save();
    };

    document.getElementById('clearAll').onclick = () => {
        if(confirm("Apagar todos os eventos permanentemente?")) {
            events = [];
            save();
            agendaModal.classList.remove('show');
        }
    };

    // Fechar no fundo
    window.onclick = (e) => {
        if(e.target == addModal) addModal.classList.remove('show');
        if(e.target == agendaModal) agendaModal.classList.remove('show');
    };

    load();
});
</script>
</body>
</html>
